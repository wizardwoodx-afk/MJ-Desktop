name: Release

# MJ 11.0 (W5). A tag produces signed installers for Windows, macOS (arm64 + x86_64) and
# Linux, plus the `latest.json` update manifest — all published by tauri-action.
#
# One-time setup (documented in INSTALL-ON-LAPTOP.md §Release):
#   1. `npm run tauri signer generate -w ~/.tauri/mj.key` — keep the private key in CI secrets.
#   2. Secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
#   3. Put the public key into src-tauri/tauri.conf.json → plugins.updater.pubkey.
#   4. Point plugins.updater.endpoints at this repository's latest.json URL.
#
# The updater verifies the minisign signature before anything else; a build without the key
# simply produces unsigned (non-updating) artifacts rather than failing the run.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: "--bundles appimage,deb"
          - os: macos-15
            args: "--target aarch64-apple-darwin"
          - os: macos-15-intel
            args: "--target x86_64-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-15' && 'aarch64-apple-darwin' || matrix.os == 'macos-15-intel' && 'x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Linux system deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev

      - name: npm ci
        run: npm ci

      - name: Verify before shipping (tsc + every probe — the same gate CI runs)
        shell: bash
        run: |
          ./node_modules/.bin/tsc --noEmit
          npm test

      - name: Build and publish signed installers + latest.json
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MJ ${{ github.ref_name }}"
          releaseBody: "Signed installers for Windows, macOS (arm64 + x86_64) and Linux. The in-app updater verifies the minisign signature of every artifact. See docs/history/MJ-11.8-UPGRADE.md for what is proven and what is not."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
