<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>MJ</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        window.__mjErrors = [];
        try {
          /* Anti-flash theme boot. `mj.editor.prefs` is the single source of truth (same store
             getEditorPrefs() reads); the legacy `mj.theme` mirror is honored only so users who
             last ran a version that wrote it do not flash the wrong theme on first load. */
          var prefs = null;
          try { prefs = JSON.parse(localStorage.getItem("mj.editor.prefs") || "null"); } catch (_) {}
          var t = prefs && typeof prefs.theme === "string" ? prefs.theme : localStorage.getItem("mj.theme");
          if (t) document.documentElement.setAttribute("data-theme", t);
        } catch (_) {}
        function record(kind, msg, src) {
          try {
            var entry = kind + ": " + msg + (src ? " @" + src : "");
            window.__mjErrors.push(entry);
            var el = document.getElementById("boot-error");
            if (!el) {
              el = document.createElement("div");
              el.id = "boot-error";
              el.style.cssText =
                "position:fixed;top:36px;left:0;right:0;z-index:99999;background:#2b0000;color:#ff6b6b;font:11px/1.5 ui-monospace,monospace;padding:10px 14px;white-space:pre-wrap;border-bottom:1px solid #a00;";
              document.body.appendChild(el);
            }
            el.textContent += entry + "\n";
          } catch (_) {}
        }
        window.addEventListener("error", function (e) {
          record("ERROR", e.message, e.filename ? e.lineno + ":" + e.colno : "");
        });
        window.addEventListener("unhandledrejection", function (e) {
          record("REJECTION", String(e.reason && e.reason.stack ? e.reason.stack : e.reason));
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Boot splash (MJ 11.9.4-Fixed): shown until React mounts and replaces #root.
           The five dots are the wabi palette — charcoal ground, washi ink, kiln,
           moss, berry. Inline-only CSS so it paints before any bundle loads. -->
      <div class="mj-boot" aria-hidden="true">
        <style>
          .mj-boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:20px;align-items:center;justify-content:center;background:#141414;color:#efeeea;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
          .mj-boot .w{display:flex;gap:10px;font-size:28px;font-weight:700;letter-spacing:.3em}
          .mj-boot .w b{opacity:0;transform:translateY(8px);animation:mjboot-l .5s cubic-bezier(.2,.9,.3,1.2) forwards}
          .mj-boot .w b:nth-child(2){animation-delay:.09s}
          .mj-boot .dots{display:flex;gap:9px}
          .mj-boot .dots i{width:7px;height:7px;border-radius:50%;opacity:.25;animation:mjboot-d 1.15s ease-in-out infinite}
          .mj-boot .dots i:nth-child(1){background:#efeeea}
          .mj-boot .dots i:nth-child(2){background:#e07a5f;animation-delay:.12s}
          .mj-boot .dots i:nth-child(3){background:#81b29a;animation-delay:.24s}
          .mj-boot .dots i:nth-child(4){background:#d1495b;animation-delay:.36s}
          .mj-boot .dots i:nth-child(5){background:#efeeea;animation-delay:.48s}
          .mj-boot .bar{width:132px;height:2px;background:rgba(239,238,234,.14);overflow:hidden;border-radius:1px}
          .mj-boot .bar i{display:block;height:100%;width:42%;background:#e07a5f;animation:mjboot-b 1s cubic-bezier(.45,0,.55,1) infinite}
          @keyframes mjboot-l{to{opacity:1;transform:translateY(0)}}
          @keyframes mjboot-d{35%{opacity:1;transform:translateY(-3px)}70%{opacity:.25;transform:translateY(0)}}
          @keyframes mjboot-b{from{transform:translateX(-110%)}to{transform:translateX(320%)}}
          @media (prefers-reduced-motion:reduce){.mj-boot *{animation:none!important;opacity:1!important;transform:none!important}}
        </style>
        <div class="w"><b>M</b><b>J</b></div>
        <div class="dots"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
