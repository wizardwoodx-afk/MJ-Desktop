[package]
name = "flamo"
version = "0.1.0"
description = "FLAMO - the Vouch Cycle personal agent"
authors = ["Vouch Harbor"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "flamo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
